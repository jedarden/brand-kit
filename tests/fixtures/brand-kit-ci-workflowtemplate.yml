apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: brand-kit-ci
  namespace: argo-workflows
spec:
  entrypoint: ci
  arguments:
    parameters:
      - name: repo
        value: jedarden/brand-kit
      - name: branch
        value: main
      - name: revision
        value: ""
  templates:
    - name: ci
      inputs:
        parameters:
          - name: repo
            value: "{{workflow.parameters.repo}}"
          - name: branch
            value: "{{workflow.parameters.branch}}"
          - name: revision
            value: "{{workflow.parameters.revision}}"
      container:
        image: debian:bookworm
        command: [bash, -c]
        args:
          - |
            set -euo pipefail

            REPO="{{inputs.parameters.repo}}"
            BRANCH="{{inputs.parameters.branch}}"
            REVISION="{{inputs.parameters.revision}}"
            WORKSPACE="${WORKSPACE:-/workspace}"
            COMMIT_OUTPUT="${COMMIT_OUTPUT:-/tmp/commit}"

            printf '%s\n' "$REVISION" | grep -Eq '^[0-9a-fA-F]{40}$'
            git clone --no-tags --depth=1 --no-checkout --branch "$BRANCH" \
              "$REPO" "$WORKSPACE"
            git -C "$WORKSPACE" fetch --no-tags --depth=1 origin "$REVISION"
            git -C "$WORKSPACE" checkout --detach --quiet "$REVISION"
            test "$(git -C "$WORKSPACE" rev-parse --verify HEAD^{commit})" = "$REVISION"
            if git -C "$WORKSPACE" symbolic-ref --quiet HEAD >/dev/null; then
              echo "checkout is not detached" >&2
              exit 1
            fi
            printf '%s\n' "$(git -C "$WORKSPACE" rev-parse --verify HEAD^{commit})" \
              > "$COMMIT_OUTPUT"
      outputs:
        parameters:
          - name: commit
            valueFrom:
              path: /tmp/commit
