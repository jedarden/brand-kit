apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: brand-kit-platform-requirements
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: "Daily freshness and HTTPS reachability check for platform requirement sources"
spec:
  schedules:
    - "27 6 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: brand-kit-platform-requirements
