apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: brand-kit-platform-requirements
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: "Read-only platform requirement freshness and source reachability check with owner alerting"
spec:
  entrypoint: check
  onExit: route-platform-requirements
  serviceAccountName: argo-workflow
  activeDeadlineSeconds: 900
  templates:
    - name: check
      container:
        image: python:3.13.5-slim-bookworm
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            printf '%s\n' '{"schema":"brand-kit-platform-requirements/v2","status":"indeterminate","summary":{"metadata_failures":0,"pass":0,"http_failure":0,"network_failure":1,"content_changed":0,"content_unpinned":1},"metadata_issues":[],"evidence_issues":[],"source_checks":[],"error":"workflow did not reach the platform requirement checker"}' \
              > /tmp/brand-kit-platform-requirements-report.json
            printf '2\n' > /tmp/brand-kit-platform-requirements-exit-code
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
            git clone --filter=blob:none --no-tags --depth=1 --branch main \
              https://git.ardenone.com/jedarden/brand-kit.git /brand-kit
            cd /brand-kit
            set +e
            python3 tools/check_platform_requirements.py \
              --check-reachability \
              --max-age-days 180 \
              --timeout-seconds 15 \
              --report /tmp/brand-kit-platform-requirements-report.json
            CHECK_EXIT=$?
            set -e
            printf '%s\n' "$CHECK_EXIT" > /tmp/brand-kit-platform-requirements-exit-code
            exit "$CHECK_EXIT"
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 768Mi
      outputs:
        parameters:
          - name: platform-requirements-exit-code
            valueFrom:
              path: /tmp/brand-kit-platform-requirements-exit-code
              default: "2"
        artifacts:
          - name: platform-requirements-report
            path: /tmp/brand-kit-platform-requirements-report.json
            archive:
              none: {}
            artifactGC:
              strategy: Never
            s3:
              endpoint: s3.ardenone.com
              bucket: needle-ci-artifacts
              region: garage
              insecure: false
              key: failures/brand-kit-platform-requirements/v2/{{workflow.uid}}/report.json
              accessKeySecret:
                name: needle-ci-artifact-publisher
                key: access-key
              secretKeySecret:
                name: needle-ci-artifact-publisher
                key: secret-key
    - name: route-platform-requirements
      steps:
        - - name: notify-owner
            template: notify-owner
            when: "{{workflow.status}} != Succeeded"
            continueOn:
              failed: true
              error: true
    - name: notify-owner
      container:
        image: curlimages/curl:8.12.1
        command: [sh, -c]
        args:
          - |
            set -eu
            REPORT_URL="https://s3.ardenone.com/needle-ci-artifacts/failures/brand-kit-platform-requirements/v2/{{workflow.uid}}/report.json"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              http://alertmanager.monitoring.svc:9093/api/v1/alerts <<EOF
            [{
              "labels": {
                "alertname": "BrandKitPlatformRequirements",
                "owner": "jedarden",
                "component": "platform-requirements",
                "follow_up": "platform-requirements",
                "bucket": "brand-kit",
                "workflow_status": "{{workflow.status}}"
              },
              "annotations": {
                "summary": "brand-kit platform requirement sources need follow-up",
                "description": "Workflow {{workflow.name}} ended {{workflow.status}}; inspect the durable report for stale metadata, HTTP failures, or indeterminate network failures.",
                "report_url": "${REPORT_URL}"
              }
            }]
            EOF
            echo "brand-kit platform-requirements owner alert sent: ${REPORT_URL}"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
