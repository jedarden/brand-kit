apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: brand-kit-consumer-drift
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: "Daily read-only fallback: audit the newest stable Forgejo release at least 24 hours old and visible on the read-only mirror"
spec:
  # 06:17 UTC daily. consumer-drift.json owns the 24-hour release propagation delay.
  schedules:
    - "17 6 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: brand-kit-consumer-drift
    arguments:
      parameters:
        - name: brand-kit-repository
          value: https://github.com/jedarden/brand-kit.git
        - name: site-repository
          value: https://github.com/jedarden/jedarden.com.git
        # Empty means the fallback discovers the newest stable release after
        # consumer-drift.json's minimum propagation age.
        - name: release-tag
          value: ""
        - name: release-commit
          value: ""
