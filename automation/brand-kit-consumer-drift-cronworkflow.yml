apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: brand-kit-consumer-drift
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: "Daily read-only fallback: audit the newest stable Forgejo release at least 24 hours old and visible on the read-only mirror"
spec:
  # SUSPENDED 2026-10-10 (brandkit-00a96a8d): every daily run failed and
  # none can succeed until conditions outside this repo change:
  #   1. jedarden/brand-kit has no Forgejo release at all (releases API
  #      returns []), so the daily fallback has no release to audit and no
  #      consumer drift can exist yet.
  #   2. Report pruning fails first: the needle-ci-artifact-reader
  #      credential gets "Garage GET request failed with HTTP 403" listing
  #      failures/brand-kit-consumer-drift/v1/ (credential scope is managed
  #      outside brand-kit).
  #   3. The dedicated ServiceAccount brand-kit-consumer-drift lacks the
  #      workflowtaskresults create/patch grant (declarative-config
  #      k8s/iad-ci/argo-workflows/brand-kit-automation-rbac.yml), so the
  #      executor cannot report outputs and the wait container exits 64.
  # Resume (delete this field) once a stable release exists and 2-3 are
  # fixed. This suspends only the daily fallback; the release-triggered
  # submission path (tools/consumer_drift_submit.py) is untouched but shares
  # causes 2-3.
  suspend: true
  # 06:17 UTC daily. consumer-drift.json owns the 24-hour release propagation delay.
  schedules:
    - "17 6 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: brand-kit-consumer-drift
    arguments:
      parameters:
        - name: brand-kit-repository
          value: https://github.com/jedarden/brand-kit.git
        - name: site-repository
          value: https://github.com/jedarden/jedarden.com.git
        # Empty means the fallback discovers the newest stable release after
        # consumer-drift.json's minimum propagation age.
        - name: release-tag
          value: ""
        - name: release-commit
          value: ""
