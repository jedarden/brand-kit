apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: brand-kit-ci-failure-watch
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: "Read-only owner alert and durable evidence archive for brand-kit-ci runs"
    # These values mirror declarative-config's controller.workflowDefaults
    # secondsAfterFailure and the command below. Run
    # tools/check_ci_failure_watch_retention.py to detect drift before deploy.
    brand-kit.ardenone.com/argo-failure-retention-seconds: "7200"
    brand-kit.ardenone.com/failure-watch-lookback-minutes: "120"
spec:
  entrypoint: watch
  onExit: route-ci-failure-watch
  serviceAccountName: brand-kit-ci-failure-watch
  activeDeadlineSeconds: 600
  templates:
    - name: watch
      container:
        image: python:3.13.5-slim-bookworm
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            # Keep evidence even when installation, cloning, or the API call
            # fails before the watcher can create its normal report.
            printf '%s\n' '{"schema":"brand-kit-ci-failure-watch/v1","status":"error","error":"watcher did not reach the Argo API","failures":[]}' \
              > /tmp/brand-kit-ci-failure-report.json
            printf '%s\n' '{"schema":"brand-kit-ci-attestation/v1","watcher_workflow_uid":"{{workflow.uid}}","attestations":[]}' \
              > /tmp/brand-kit-ci-attestations.json
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
            git clone --filter=blob:none --no-tags --depth=1 --branch main \
              https://github.com/jedarden/brand-kit.git /brand-kit
            set +e
            python3 /brand-kit/tools/prune_ci_failure_watch_reports.py \
              --retention-days 30
            PRUNE_EXIT=$?
            set -e
            if [ "$PRUNE_EXIT" -ne 0 ]; then
              printf '%s\n' '{"schema":"brand-kit-ci-failure-watch/v1","status":"error","error":"failure-watch report retention cleanup did not complete","failures":[]}' \
                > /tmp/brand-kit-ci-failure-report.json
              printf '%s\n' '2' > /tmp/brand-kit-ci-failure-watch-exit-code
              exit 2
            fi
            set +e
            python3 /brand-kit/tools/prune_ci_attestations.py \
              --retention-days 30 \
              --release-evidence-root /brand-kit/release-evidence/v1
            ATTESTATION_PRUNE_EXIT=$?
            set -e
            if [ "$ATTESTATION_PRUNE_EXIT" -ne 0 ]; then
              printf '%s\n' '{"schema":"brand-kit-ci-failure-watch/v1","status":"error","error":"CI attestation retention cleanup did not complete","failures":[]}' \
                > /tmp/brand-kit-ci-failure-report.json
              printf '%s\n' '2' > /tmp/brand-kit-ci-failure-watch-exit-code
              exit 2
            fi
            set +e
            python3 /brand-kit/tools/brand_kit_ci_failure_watch.py \
              --report /tmp/brand-kit-ci-failure-report.json \
              --attestations /tmp/brand-kit-ci-attestations.json \
              --watcher-workflow-uid "{{workflow.uid}}" \
              --lookback-minutes 120
            WATCH_EXIT=$?
            set -e
            printf '%s\n' "$WATCH_EXIT" > /tmp/brand-kit-ci-failure-watch-exit-code
            exit "$WATCH_EXIT"
        env:
          - name: ARGO_WORKFLOW_TOKEN
            valueFrom:
              secretKeyRef:
                name: brand-kit-workflow-readonly
                key: token
          - name: S3_READER_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: needle-ci-artifact-reader
                key: access-key
          - name: S3_READER_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: needle-ci-artifact-reader
                key: secret-key
          - name: S3_PUBLISHER_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: needle-ci-artifact-publisher
                key: access-key
          - name: S3_PUBLISHER_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: needle-ci-artifact-publisher
                key: secret-key
          - name: S3_ENDPOINT
            value: https://s3.ardenone.com
          - name: S3_REGION
            value: garage
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      outputs:
        parameters:
          - name: watcher-exit-code
            valueFrom:
              path: /tmp/brand-kit-ci-failure-watch-exit-code
              default: "2"
        artifacts:
          - name: brand-kit-ci-failure-report
            path: /tmp/brand-kit-ci-failure-report.json
            archive:
              none: {}
            artifactGC:
              strategy: Never
            s3:
              endpoint: s3.ardenone.com
              bucket: needle-ci-artifacts
              region: garage
              insecure: false
              key: failures/brand-kit-ci-failure-watch/v1/{{workflow.uid}}/report.json
              accessKeySecret:
                name: needle-ci-artifact-publisher
                key: access-key
              secretKeySecret:
                name: needle-ci-artifact-publisher
                key: secret-key
          - name: brand-kit-ci-attestations
            path: /tmp/brand-kit-ci-attestations.json
            archive:
              none: {}
            # Successful brand-kit-ci Workflow objects and logs are short-lived;
            # this record is the publication gate's durable fallback.
            artifactGC:
              strategy: Never
            s3:
              endpoint: s3.ardenone.com
              bucket: needle-ci-artifacts
              region: garage
              insecure: false
              key: attestations/brand-kit-ci/v1/{{workflow.uid}}/attestations.json
              accessKeySecret:
                name: needle-ci-artifact-publisher
                key: access-key
              secretKeySecret:
                name: needle-ci-artifact-publisher
                key: secret-key
    # A non-success watcher run means either that it found a failed/error
    # brand-kit-ci run or that it could not inspect Argo.  Alertmanager's
    # configured ntfy receiver routes the event to the brand-kit owner.
    - name: route-ci-failure-watch
      steps:
        - - name: notify-owner
            template: notify-owner
            when: "{{workflow.status}} != Succeeded"
            continueOn:
              failed: true
              error: true
    - name: notify-owner
      container:
        image: curlimages/curl:8.12.1
        command: [sh, -c]
        args:
          - |
            set -eu
            REPORT_URL="https://s3.ardenone.com/needle-ci-artifacts/failures/brand-kit-ci-failure-watch/v1/{{workflow.uid}}/report.json"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              http://alertmanager.monitoring.svc:9093/api/v1/alerts <<EOF
            [{
              "labels": {
                "alertname": "BrandKitCIRegressionGate",
                "owner": "jedarden",
                "component": "brand-kit-ci",
                "follow_up": "regression-gate",
                "bucket": "brand-kit",
                "workflow_status": "{{workflow.status}}"
              },
              "annotations": {
                "summary": "brand-kit-ci regression gate needs follow-up",
                "description": "The scheduled read-only watcher found a failed/error brand-kit-ci run or could not inspect Argo. Inspect the durable report before publishing any release.",
                "report_url": "${REPORT_URL}"
              }
            }]
            EOF
            echo "brand-kit-ci owner alert sent: ${REPORT_URL}"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
