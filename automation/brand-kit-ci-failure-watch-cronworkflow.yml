apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: brand-kit-ci-failure-watch
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: "Every-15-minute read-only alert and attestation archive for brand-kit-ci runs"
spec:
  # The two-hour lookback covers the cluster's failure-log TTL. The watcher
  # also copies each recent successful run's minimal attestation to Garage
  # before the brand-kit-ci Workflow record can be reaped.
  schedules:
    - "*/15 * * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: brand-kit-ci-failure-watch
