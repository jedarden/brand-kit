apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: brand-kit-mirror-health
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: "Read-only Forgejo-to-GitHub branch and tag parity report with owner alerting; release tags use check_release_mirror.py and remain Forgejo-only"
spec:
  entrypoint: check
  onExit: route-mirror-health
  serviceAccountName: argo-workflow
  activeDeadlineSeconds: 1800
  templates:
    - name: check
      container:
        image: python:3.13.5-slim-bookworm
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            # Preserve a diagnostic artifact even when setup or the canonical
            # checkout fails before the checker can run.
            printf '%s\n' '{"schema":"brand-kit-mirror-health/v1","status":"indeterminate","summary":{"match":0,"missing":0,"stale":0,"divergent":0,"indeterminate":1},"checks":[],"error":"workflow did not reach the mirror-health checker"}' \
              > /tmp/brand-kit-mirror-health-report.json
            printf '2\n' > /tmp/brand-kit-mirror-health-exit-code
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
            # The checker's own code comes from the public GitHub mirror, like
            # every other scheduled brand-kit check. Cloning it from Forgejo
            # fails twice over: anonymously (REQUIRE_SIGNIN_VIEW, "could not
            # read Username", exit 128 on every run to 2026-10-10) and, even
            # authenticated, the full-tree pack download from git.ardenone.com
            # dies with "fetch-pack: unexpected disconnect while reading
            # sideband packet" (reproduced 2026-10-10, partial and shallow).
            # The canonical side is still read from Forgejo below -- by
            # ls-remote and a ref fetch, which the checker does itself.
            git clone --filter=blob:none --no-tags --depth=1 --branch main \
              https://github.com/jedarden/brand-kit.git /brand-kit
            cd /brand-kit
            # This scheduled parity audit is read-only. Release publication
            # additionally runs tools/check_release_mirror.py for the exact
            # expected tag; transient GitHub mirror lag is indeterminate, and
            # no GitHub Release object is queried or created.
            set +e
            python3 tools/check_mirror_health.py \
              --canonical-repository https://git.ardenone.com/jedarden/brand-kit.git \
              --mirror-repository https://github.com/jedarden/brand-kit.git \
              --report /tmp/brand-kit-mirror-health-report.json
            CHECK_EXIT=$?
            set -e
            printf '%s\n' "$CHECK_EXIT" > /tmp/brand-kit-mirror-health-exit-code
            exit "$CHECK_EXIT"
        # git.ardenone.com runs with REQUIRE_SIGNIN_VIEW=true, so the
        # checker's canonical ls-remote/fetch needs a credential. The token
        # is the existing READ-ONLY Forgejo repo token
        # (rs-manager/iad-ci/forgejo/repo-readonly, synced as Secret
        # brand-kit-consumer-drift) -- deliberately not the CI-wide
        # write-capable forgejo-webhook-token, since this audit only reads.
        # It reaches git through a credential helper, never a URL or argv,
        # so neither the report nor a failed-command message can carry it.
        env:
          - name: GIT_TERMINAL_PROMPT
            value: "0"
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.https://git.ardenone.com.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
          - name: FORGEJO_TOKEN
            valueFrom:
              secretKeyRef:
                name: brand-kit-consumer-drift
                key: token
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 768Mi
      outputs:
        parameters:
          - name: mirror-health-exit-code
            valueFrom:
              path: /tmp/brand-kit-mirror-health-exit-code
              default: "2"
        artifacts:
          - name: brand-kit-mirror-health-report
            path: /tmp/brand-kit-mirror-health-report.json
            archive:
              none: {}
            artifactGC:
              strategy: Never
            s3:
              endpoint: s3.ardenone.com
              bucket: needle-ci-artifacts
              region: garage
              insecure: false
              key: failures/brand-kit-mirror-health/v1/{{workflow.uid}}/report.json
              accessKeySecret:
                name: needle-ci-artifact-publisher
                key: access-key
              secretKeySecret:
                name: needle-ci-artifact-publisher
                key: secret-key
    # The checker exits non-zero for confirmed drift and for inconclusive
    # provider responses. Alertmanager routes both states to the owner.
    - name: route-mirror-health
      steps:
        - - name: notify-owner
            template: notify-owner
            when: "{{workflow.status}} != Succeeded"
            continueOn:
              failed: true
              error: true
    - name: notify-owner
      container:
        image: curlimages/curl:8.12.1
        command: [sh, -c]
        args:
          - |
            set -eu
            REPORT_URL="https://s3.ardenone.com/needle-ci-artifacts/failures/brand-kit-mirror-health/v1/{{workflow.uid}}/report.json"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              http://alertmanager.monitoring.svc:9093/api/v2/alerts <<EOF
            [{
              "labels": {
                "alertname": "BrandKitMirrorHealth",
                "owner": "jedarden",
                "component": "forgejo-github-mirror",
                "follow_up": "mirror-health",
                "bucket": "brand-kit",
                "workflow_status": "{{workflow.status}}"
              },
              "annotations": {
                "summary": "brand-kit Forgejo-to-GitHub mirror needs follow-up",
                "description": "The scheduled read-only mirror check found a missing, stale, or divergent branch/tag, or could not inspect one of the repositories. Inspect the durable report before release or consumer processing.",
                "report_url": "${REPORT_URL}"
              }
            }]
            EOF
            echo "brand-kit mirror-health owner alert sent: ${REPORT_URL}"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
