apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: brand-kit-consumer-drift
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/description: "Read-only consumer drift audit for a published Forgejo release"
spec:
  entrypoint: audit
  # A failed audit is an owner-facing event, not merely an Argo UI status.
  # Keep the handler best-effort so an Alertmanager outage cannot hide the
  # detector's original non-zero result.
  onExit: route-drift
  serviceAccountName: argo-workflow
  activeDeadlineSeconds: 1800
  arguments:
    parameters:
      - name: brand-kit-repository
        value: https://github.com/jedarden/brand-kit.git
      - name: site-repository
        value: https://github.com/jedarden/jedarden.com.git
      - name: release-tag
        value: ""
  templates:
    - name: audit
      container:
        image: python:3.13.5-slim-bookworm
        command: [bash, -c]
        args:
          - |
            set -euo pipefail
            # These fallbacks make the report and exit-code outputs available
            # even when package installation, cloning, or mirror polling
            # fails before the detector can run. The report is uploaded by
            # Argo after the pod exits, so it must never be /tmp-only state.
            printf '%s\n' '{"schema":"brand-kit-consumer-drift/v1","status":"indeterminate","errors":["workflow did not reach the detector"]}' \
              > /tmp/consumer-drift-report.json
            printf '2\n' > /tmp/consumer-drift-exit-code
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
            python3 -m pip install --no-cache-dir --only-binary=:all: Pillow==12.1.1
            git clone --filter=blob:none --no-tags "{{workflow.parameters.brand-kit-repository}}" /brand-kit
            cd /brand-kit
            TAG="{{workflow.parameters.release-tag}}"
            if [ -z "$TAG" ]; then
              TAG="$(python3 tools/consumer_drift.py \
                --config consumer-drift.json \
                --mirror-repository "{{workflow.parameters.brand-kit-repository}}" \
                --print-release-tag)"
            fi

            # A Forgejo release webhook can arrive before the server-side
            # GitHub tag mirror. Wait for the exact peeled tag before fetching
            # it; the daily CronWorkflow uses the same gate as its fallback.
            MIRROR_COMMIT=""
            for attempt in $(seq 1 60); do
              MIRROR_COMMIT="$(git ls-remote --exit-code "{{workflow.parameters.brand-kit-repository}}" "refs/tags/${TAG}^{}" 2>/dev/null | awk 'NR == 1 { print $1 }')" || true
              if [ -n "$MIRROR_COMMIT" ]; then
                break
              fi
              if [ "$attempt" -lt 60 ]; then
                sleep 10
              fi
            done
            if [ -z "$MIRROR_COMMIT" ]; then
              echo "release tag ${TAG} did not reach the read-only mirror within 10 minutes" >&2
              exit 1
            fi

            git clone --filter=blob:none --no-tags "{{workflow.parameters.brand-kit-repository}}" /release
            git -C /release fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git -C /release checkout --detach --quiet "$TAG"
            git clone --filter=blob:none --depth=1 --branch main "{{workflow.parameters.site-repository}}" /jedarden.com
            set +e
            python3 /brand-kit/tools/consumer_drift.py \
              --source-root /release \
              --config /brand-kit/consumer-drift.json \
              --release-tag "$TAG" \
              --site /jedarden.com \
              --report /tmp/consumer-drift-report.json \
              --json
            DETECTOR_EXIT=$?
            set -e
            printf '%s\n' "$DETECTOR_EXIT" > /tmp/consumer-drift-exit-code
            exit "$DETECTOR_EXIT"
        outputs:
          parameters:
            - name: detector-exit-code
              valueFrom:
                path: /tmp/consumer-drift-exit-code
                default: "2"
          artifacts:
            - name: consumer-drift-report
              path: /tmp/consumer-drift-report.json
              archive:
                none: {}
              # The owner notification links to this object after Argo has
              # deleted the pod and (eventually) the Workflow CR.
              artifactGC:
                strategy: Never
              s3:
                endpoint: s3.ardenone.com
                bucket: needle-ci-artifacts
                region: garage
                insecure: false
                key: failures/brand-kit-consumer-drift/v1/{{workflow.uid}}/report.json
                accessKeySecret:
                  name: needle-ci-artifact-publisher
                  key: access-key
                secretKeySecret:
                  name: needle-ci-artifact-publisher
                  key: secret-key
        env:
          - name: FORGEJO_TOKEN
            valueFrom:
              secretKeyRef:
                name: brand-kit-consumer-drift
                key: token
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    # Workflow-level exit handler. Alertmanager's configured ntfy receiver
    # routes this alert to the brand-kit owner. The step is conditional on a
    # non-success workflow, which includes detector exit 1 (confirmed drift),
    # exit 2 (indeterminate), and failures before the detector starts.
    - name: route-drift
      steps:
        - - name: notify-owner
            template: notify-owner
            when: "{{workflow.status}} != Succeeded"
            continueOn:
              failed: true
              error: true
    - name: notify-owner
      container:
        image: curlimages/curl:8.12.1
        command: [sh, -c]
        args:
          - |
            set -eu
            REPORT_URL="https://s3.ardenone.com/needle-ci-artifacts/failures/brand-kit-consumer-drift/v1/{{workflow.uid}}/report.json"
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              -H 'Content-Type: application/json' \
              --data-binary @- \
              http://alertmanager.monitoring.svc:9093/api/v1/alerts <<EOF
            [{
              "labels": {
                "alertname": "BrandKitConsumerDrift",
                "owner": "jedarden",
                "component": "consumer-drift",
                "bucket": "brand-kit",
                "workflow_status": "{{workflow.status}}"
              },
              "annotations": {
                "summary": "brand-kit consumer drift audit needs follow-up",
                "description": "Workflow {{workflow.name}} ended {{workflow.status}}; inspect the durable report and run the post-tag consumer-update checklist.",
                "report_url": "${REPORT_URL}"
              }
            }]
            EOF
            echo "Consumer-drift owner alert sent: ${REPORT_URL}"
